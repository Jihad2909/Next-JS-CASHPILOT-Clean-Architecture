services:
  postgres:
    image: postgres:16-alpine
    container_name: cashpilot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cashpilot
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: cashpilot
    ports:
      - "5435:5432"
    volumes:
      - cashpilot_pgdata:/var/lib/postgresql/data

volumes:
  cashpilot_pgdata: